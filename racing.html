<head>
    <meta charset="UTF-8">

    <title>Gamehub - Racing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: #ffcc00;
            text-shadow: 0 0 20px #ff8800;

        #game {
            position: relative;
            width: 360px;
            height: 600px;
            max-width: 95vw;

            overflow: hidden;

            background:
                repeating-linear-gradient(
                    0deg,

                );

        #player::after {
            content: "";
            position: absolute;
            width: 10px;

        }

        #player::before {
            left: -6px;

        #player::after {
            right: -6px;
        }

        .enemy {
            position: absolute;
            width: 48px;
            height: 80px;

            background: #2979ff;
            border-radius: 10px;

            box-shadow: 0 0 15px #2979ff;
        }

        .enemy::before,
        .enemy::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 20px;

            bottom: 15px;
            border-radius: 4px;
        }

        .enemy::before {
            left: -6px;
        }

        .enemy::after {
            right: -6px;
        }

</head>

<body>

    <h1>🏎️ RACING</h1>

    <div class="info">
        Score: <strong id="score">0</strong>
    </div>

    <div class="message" id="message">
        Klik op START!
    </div>

    <button onclick="startGame()">▶ START</button>
    <button onclick="restartGame()">🔄 OPNIEUW</button>

    <div id="game">

        <div class="line" style="top: 0;"></div>
        <div class="line" style="top: 160px;"></div>
        <div class="line" style="top: 320px;"></div>
        <div class="line" style="top: 480px;"></div>

        <div id="player"></div>

    </div>

    <p>
        Gebruik ⬅️ ➡️ om je auto te besturen!
    </p>

    <a href="index.html">
        ← Terug naar Gamehub
    </a>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");

let playerX = 156;
let score = 0;
let playing = false;

let enemies = [];
let gameTimer;
let enemyTimer;
let lineTimer;

function startGame() {

    if (playing) return;

    restartGame();

    playing = true;

    message.textContent =
        "🏎️ RACE! Ontwijk de auto's!";

    gameTimer = setInterval(updateGame, 20);

    enemyTimer = setInterval(createEnemy, 1000);

    lineTimer = setInterval(moveLines, 20);
}

function restartGame() {

    clearInterval(gameTimer);
    clearInterval(enemyTimer);
    clearInterval(lineTimer);

    enemies.forEach(enemy => enemy.remove());

    enemies = [];

    playing = false;

    playerX = 156;
    player.style.left = playerX + "px";

    score = 0;
    scoreText.textContent = score;

    message.textContent =
        "Klik op START!";
}

function createEnemy() {

    if (!playing) return;

    const enemy = document.createElement("div");

    enemy.className = "enemy";

    const lane =
        Math.floor(Math.random() * 3);

    const positions = [
        65,
        156,
        247
    ];

    enemy.style.left =
        positions[lane] + "px";

    enemy.style.top = "-90px";

    game.appendChild(enemy);

    enemies.push(enemy);
}

function updateGame() {

    if (!playing) return;

    score++;

    scoreText.textContent =
        Math.floor(score / 10);

    enemies.forEach((enemy, index) => {

        let y =
            parseInt(enemy.style.top) || -90;

        y += 5;

        enemy.style.top =
            y + "px";

        if (y > 620) {

            enemy.remove();

            enemies.splice(index, 1);
        }

        if (collision(player, enemy)) {

            gameOver();
        }
    });
}

function collision(a, b) {

    const aRect =
        a.getBoundingClientRect();

    const bRect =
        b.getBoundingClientRect();

    return !(
        aRect.right < bRect.left ||
        aRect.left > bRect.right ||
        aRect.bottom < bRect.top ||
        aRect.top > bRect.bottom
    );
}

function moveLines() {

    const lines =
        document.querySelectorAll(".line");

    lines.forEach(line => {

        let y =
            parseInt(line.style.top);

        y += 6;

        if (y > 600) {
            y = -80;
        }

        line.style.top =
            y + "px";
    });
}

function gameOver() {

    playing = false;

    clearInterval(gameTimer);
    clearInterval(enemyTimer);
    clearInterval(lineTimer);

    message.textContent =
        "💥 CRASH! Score: " +
        Math.floor(score / 10);
}

document.addEventListener("keydown", event => {

    if (!playing) return;

    if (
        event.key === "ArrowLeft" &&
        playerX > 45
    ) {

        playerX -= 10;

        player.style.left =
            playerX + "px";
    }

    if (
        event.key === "ArrowRight" &&
        playerX < 267
    ) {

        playerX += 10;

        player.style.left =
            playerX + "px";
    }
});

</script>

</body>
</html>
