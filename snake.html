<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamehub - Snake</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #090512;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.game {
    width: min(95vw, 560px);
    text-align: center;
}

h1 {
    font-size: 48px;
    margin: 0 0 10px;
    color: #b66cff;
    text-shadow: 0 0 20px #8b35ff;
}

.stats {
    display: flex;
    justify-content: space-between;
    margin: 15px 0;
    padding: 12px 18px;
    background: #171126;

}

canvas {
    width: 100%;
    max-width: 500px;
    aspect-ratio: 1 / 1;
    background: #05030a;
    border: 3px solid #8b35ff;
    border-radius: 12px;
    display: block;
    margin: auto;
}

    border: none;
    border-radius: 10px;
    padding: 12px 20px;

    cursor: pointer;

button:hover {
    background: #9b5cff;
}

.message {
    min-height: 28px;

}

.controls {
    margin: 15px auto;

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
}

.controls button {
    padding: 12px 0;
    font-size: 20px;
}

.up {
    grid-column: 2;
}

.left {
    grid-column: 1;
}

.down {
    grid-column: 2;
}

.right {
    grid-column: 3;
    grid-row: 2;
}

.back {
    display: inline-block;
    margin-top: 15px;
    color: #c99cff;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="game">

    <h1>🐍 SNAKE</h1>

    <div class="stats">
        <span>Score: <strong id="score">0</strong></span>
        <span>Highscore: <strong id="highscore">0</strong></span>
    </div>

    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <div class="message" id="message">
        Druk op Start om te spelen!
    </div>

    <div>
        <button onclick="startGame()">▶ Start</button>
        <button onclick="pauseGame()">⏸ Pauze</button>
        <button onclick="restartGame()">🔄 Opnieuw</button>
    </div>

    <div class="controls">
        <button class="up" onclick="changeDirection('up')">⬆️</button>
        <button class="left" onclick="changeDirection('left')">⬅️</button>
        <button class="right" onclick="changeDirection('right')">➡️</button>
        <button class="down" onclick="changeDirection('down')">⬇️</button>
    </div>

    <a class="back" href="index.html">← Terug naar Gamehub</a>

</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const grid = 25;
const tiles = 20;

let snake;
let food;
let direction;
let nextDirection;
let score = 0;
let gameRunning = false;
let paused = false;
let gameLoop;

let highscore = Number(localStorage.getItem("snakeHighscore")) || 0;

document.getElementById("highscore").textContent = highscore;

function createGame() {

    snake = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10}
    ];

    direction = "right";
    nextDirection = "right";
    score = 0;

    document.getElementById("score").textContent = score;

    createFood();
    draw();
}

function createFood() {

    do {
        food = {
            x: Math.floor(Math.random() * tiles),
            y: Math.floor(Math.random() * tiles)
        };
    } while (
        snake.some(part =>
            part.x === food.x && part.y === food.y
        )
    );
}

function draw() {

    ctx.fillStyle = "#05030a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Voedsel
    ctx.fillStyle = "#ff3b81";

    ctx.beginPath();

    ctx.arc(
        food.x * grid + grid / 2,
        food.y * grid + grid / 2,
        8,
        0,
        Math.PI * 2
    );

    ctx.fill();

    // Slang
    snake.forEach((part, index) => {

        ctx.fillStyle =
            index === 0 ? "#c084fc" : "#7c3aed";

        ctx.fillRect(
            part.x * grid + 2,
            part.y * grid + 2,
            grid - 4,
            grid - 4
        );
    });
}

function update() {

    if (!gameRunning || paused) return;

    direction = nextDirection;

    const head = {
        x: snake[0].x,
        y: snake[0].y
    };

    if (direction === "up") head.y--;
    if (direction === "down") head.y++;
    if (direction === "left") head.x--;
    if (direction === "right") head.x++;

    // Muur
    if (
        head.x < 0 ||
        head.x >= tiles ||
        head.y < 0 ||
        head.y >= tiles
    ) {
        gameOver();
        return;
    }

    // Zelf raken
    if (
        snake.some(part =>
            part.x === head.x &&
            part.y === head.y
        )
    ) {
        gameOver();
        return;
    }

    snake.unshift(head);

    // Eten
    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;

        document.getElementById("score").textContent = score;

        if (score > highscore) {

            highscore = score;

            localStorage.setItem(
                "snakeHighscore",
                highscore
            );

            document.getElementById("highscore").textContent =
                highscore;
        }

        createFood();

    } else {

        snake.pop();
    }

    draw();
}

function startGame() {

    if (gameRunning) return;

    gameRunning = true;
    paused = false;

    document.getElementById("message").textContent =
        "🐍 Veel succes!";

    clearInterval(gameLoop);

    gameLoop = setInterval(update, 120);
}

function pauseGame() {

    if (!gameRunning) return;

    paused = !paused;

    document.getElementById("message").textContent =
        paused ? "⏸ Gepauzeerd" : "🐍 Verder spelen!";
}

function restartGame() {

    clearInterval(gameLoop);

    gameRunning = false;
    paused = false;

    createGame();

    document.getElementById("message").textContent =
        "Druk op Start om te spelen!";
}

function gameOver() {

    gameRunning = false;

    clearInterval(gameLoop);

    document.getElementById("message").textContent =
        "💀 Game Over! Score: " + score;
}

function changeDirection(newDirection) {

    if (newDirection === "up" && direction !== "down")
        nextDirection = "up";

    if (newDirection === "down" && direction !== "up")
        nextDirection = "down";

    if (newDirection === "left" && direction !== "right")
        nextDirection = "left";

    if (newDirection === "right" && direction !== "left")
        nextDirection = "right";
}

document.addEventListener("keydown", event => {

    if (event.key === "ArrowUp")
        changeDirection("up");

    if (event.key === "ArrowDown")
        changeDirection("down");

    if (event.key === "ArrowLeft")
        changeDirection("left");

    if (event.key === "ArrowRight")
        changeDirection("right");

    if (event.key === " ")
        pauseGame();
});

createGame();

</script>

</body>
</html>
